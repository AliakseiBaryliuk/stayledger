name: OpenSpec archive

on:
  pull_request:
    branches: [stayledger-codex]

permissions:
  contents: read

jobs:
  archive:
    name: archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check OpenSpec archive
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_openspec_archive.py --base "$BASE_SHA" --head "$HEAD_SHA"
