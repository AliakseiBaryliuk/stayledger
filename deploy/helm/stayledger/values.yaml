nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

existingSecret:
  name: ""
  keys:
    dbUrl: DB_URL
    dbUsername: DB_USERNAME
    dbPassword: DB_PASSWORD

config:
  serverPort: 8081

service:
  type: ClusterIP
  port: 8081

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

strategy:
  maxUnavailable: 0
  maxSurge: 1

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
