# openspec/config.yaml
schema: spec-driven

context: |
  StayLedger — short-term apartment rental management.
  Stack: Java 21, Spring Boot 3.x, Gradle, PostgreSQL, Liquibase, Telegram Bot API, Spring AI.
  Modular monolith: _core (core-api, core-impl), _infra (adapters), _ms (Spring Boot app).
  Work is organized as mini-scenarios; they talk via Spring Events.
  Read docs/architecture.md and docs/codestyle.md before planning or applying.
  Secrets only in .env, never commit.
  Write OpenSpec artifacts in English.

rules:
  proposal:
    - "State affected mini-scenarios and user-visible flow; name what is out of scope."
    - "If the change touches money, bookings, or inventory, call out data/prepayment risk."
  specs:
    - "One observable behavior per requirement, with SHALL/MUST; no ports, entities, modules, or frameworks."
    - "Map each capability to one mini-scenario name when a new capability is introduced."
    - "Cover failure and edge scenarios, not only the happy path."
  design:
    - "Follow the mini-scenario slice: core-api + core-impl + needed adapters only."
    - "AggregateRoot crosses only to postgres_adapter; other Out ports get complete DTOs/criteria."
    - "Reuse existing ports/aggregates before adding new ones; cite docs/architecture.md decisions."
  tasks:
    - "Slice tasks by layer (api, impl, adapter, tests); end each task with a commit."
    - "Plan tests per docs/architecture.md: unit for mappers/factories, integration for ports, e2e happy path last. Telegram HTTP tasks include a MockWebServer test."

operations:
  apply:
    guidance:
      - "Follow docs/codestyle.md (records, nullability, port naming, MapStruct vs factory)."
      - "Add or update package-info.java so the mini-scenario Javadoc points at openspec/specs/<capability>/spec.md."
  archive:
    guidance:
      - "Confirm delta specs still match shipped behavior before merging into main specs."
